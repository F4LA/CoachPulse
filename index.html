<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Pulse — Strong Standard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:," />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ---------- Status banner ---------- */
    .status {
      padding: 10px 16px;
      margin: 16px 32px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
    }
    .status.loading { background: var(--steel-tint); color: var(--steel-700); }
    .status.ok      { background: var(--green-bg);   color: var(--green); }
    .status.error   { background: var(--red-bg);     color: var(--red); }

    main#main { padding: 20px 32px 64px; max-width: var(--container); margin: 0 auto; }

    /* ---------- Tab strip ---------- */
    #tab-container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab-strip { display: flex; gap: 4px; }
    .tab {
      appearance: none;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 14px 22px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 120ms ease, border-color 120ms ease;
    }
    .tab:hover { color: var(--text); }
    .tab-active { color: var(--text); border-bottom-color: var(--navy-900); }
    .tab-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .tab-dot-red    { background: var(--red); }
    .tab-dot-yellow { background: var(--yellow); }

    /* ---------- Week navigation (Phase 4B.2) ---------- */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 0 4px;
    }
    .week-nav-label {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      min-width: 240px;
      text-align: center;
    }
    .week-nav-label strong {
      color: var(--text);
      font-weight: 600;
    }
    .week-nav-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 120ms ease;
      user-select: none;
    }
    .week-nav-arrow:hover:not(.week-nav-arrow-disabled):not(:disabled) {
      border-color: var(--steel-400);
      color: var(--steel-700);
      background: var(--steel-tint);
      transform: translateY(-1px);
    }
    .week-nav-arrow:focus {
      outline: none;
      border-color: var(--steel-400);
      box-shadow: 0 0 0 3px rgba(56, 153, 204, 0.18);
    }
    .week-nav-arrow:focus:not(:focus-visible) { box-shadow: none; }
    .week-nav-arrow-disabled,
    .week-nav-arrow:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--surface-2);
      color: var(--text-faint);
      border-color: var(--border);
    }
    .week-nav-arrow-disabled:hover,
    .week-nav-arrow:disabled:hover {
      transform: none;
      background: var(--surface-2);
      color: var(--text-faint);
      border-color: var(--border);
    }

    /* ---------- Coach header ---------- */
    .coach-header { margin: 20px 0 8px; }
    .coach-name {
      font-family: var(--font-display);
      font-size: 40px;
      letter-spacing: 0.04em;
      margin: 0;
      color: var(--text);
    }

    /* ---------- Sections ---------- */
    .metric-section { margin-top: 32px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0 0 14px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 1100px) {
      .tile-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ---------- Tile ---------- */
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      min-height: 200px;
      box-shadow: var(--shadow-sm);
    }
    .tile-green   { border-left-color: var(--green); }
    .tile-yellow  { border-left-color: var(--yellow); }
    .tile-red     { border-left-color: var(--red); }
    .tile-neutral { border-left-color: var(--border-strong); }

    .tile-header { margin-bottom: 14px; }
    .tile-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1.3;
    }
    .tile-description {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.45;
    }

    .tile-value-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 6px 0;
    }
    .tile-value {
      font-family: var(--font-display);
      font-size: 40px;
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--text);
    }
    .tile-green  .tile-value { color: var(--green); }
    .tile-yellow .tile-value { color: var(--yellow); }
    .tile-red    .tile-value { color: var(--red); }
    .tile-sub {
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 6px;
      font-weight: 500;
    }

    .tile-legend {
      font-size: 10.5px;
      color: var(--text-faint);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
      letter-spacing: 0.02em;
    }

    /* ---------- Tile loading skeleton (Phase 4B.2) ---------- */
    .tile.tile-loading { pointer-events: none; }
    .tile-skeleton {
      background: linear-gradient(
        90deg,
        var(--border) 0%,
        var(--surface-2) 50%,
        var(--border) 100%
      );
      background-size: 200% 100%;
      border-radius: var(--radius-sm);
      animation: tile-skeleton-pulse 1.4s ease-in-out infinite;
    }
    .tile-skeleton-value { height: 32px; width: 60%; margin-bottom: 8px; }
    .tile-skeleton-sub   { height: 12px; width: 80%; }
    @keyframes tile-skeleton-pulse {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---------- Interactive controls (CB / CC) ---------- */
    .tile-value-block-controls {
      align-items: stretch;
      justify-content: flex-start;
    }
    .tile-current {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tile-green  .tile-current { color: var(--green); }
    .tile-yellow .tile-current { color: var(--yellow); }
    .tile-red    .tile-current { color: var(--red); }

    .tile-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .ctrl-btn {
      flex: 1;
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .ctrl-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .ctrl-active {
      color: white;
      border-color: transparent;
    }
    .ctrl-active-green  { background: var(--green); }
    .ctrl-active-yellow { background: var(--yellow); }
    .ctrl-active-red    { background: var(--red); }
    .ctrl-active:hover  { opacity: 0.92; color: white; }

    .ctrl-saving {
      opacity: 0.5;
      pointer-events: none;
    }
    .ctrl-error {
      animation: shake 200ms ease;
      background: var(--red-bg) !important;
      color: var(--red) !important;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* ---------- Historical Table (Phase 4B.3) ---------- */
    .historical-section { margin-top: 40px; }
    .historical-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }
    .historical-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .historical-table thead th {
      background: var(--surface-2);
      color: var(--text-faint);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .historical-table thead th.hist-col-metric {
      text-align: left;
    }
    .historical-table tbody tr.historical-row {
      cursor: pointer;
      transition: background-color 100ms ease;
      border-bottom: 1px solid var(--border);
    }
    .historical-table tbody tr.historical-row:last-child {
      border-bottom: none;
    }
    .historical-table tbody tr.historical-row:hover {
      background: var(--steel-tint);
    }
    .historical-table tbody tr.historical-row:focus {
      outline: none;
      background: var(--steel-tint);
      box-shadow: inset 0 0 0 2px var(--steel-400);
    }
    .historical-table tbody tr.historical-row:focus:not(:focus-visible) {
      box-shadow: none;
    }
    .historical-table tbody tr.historical-row-active {
      background: var(--steel-tint);
      box-shadow: inset 3px 0 0 0 var(--navy-900);
    }
    .historical-table tbody tr.historical-row-active:hover {
      background: var(--steel-tint);
    }
    .historical-table td {
      padding: 12px 14px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .historical-table td.hist-col-week {
      font-weight: 600;
      color: var(--text);
    }
    .historical-table td.hist-col-metric {
      color: var(--text-muted);
    }
    .hist-cell-value {
      display: inline-block;
      vertical-align: middle;
    }
    .hist-cell-loading {
      color: var(--text-faint);
      font-weight: 500;
    }
    .hist-cell-empty {
      color: var(--text-faint);
    }
    .hist-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .hist-dot-green  { background: var(--green); }
    .hist-dot-yellow { background: var(--yellow); }
    .hist-dot-red    { background: var(--red); }

    /* ---------- Read-only view (Phase 4C) ---------- */
    body.readonly-mode #tab-container {
      display: none;
    }

    /* ---------- Responsive (Phase 4B.2) ---------- */
    @media (max-width: 540px) {
      .week-nav { gap: 10px; padding: 12px 0 4px; }
      .week-nav-label { min-width: 0; font-size: 13px; }
      .historical-table { font-size: 12px; }
      .historical-table td,
      .historical-table thead th { padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <span class="brand-mark">COACH PULSE</span>
      <span class="brand-sub">Strong Standard</span>
    </div>
    <div class="top-bar-right">
      <span class="brand-sub">Thursday Meeting Prep</span>
    </div>
  </header>

  <div id="status" class="status loading">Initializing…</div>

  <div id="tab-container"></div>

  <main id="main"></main>

  <!-- Engine: imported from F4LA/FlagSystem via jsdelivr, pinned to commit 9b179bb -->
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/coaching-week.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/client-timeline.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/consecutive-evaluable.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/pathway-evaluators.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/color-deriver.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/F4LA/FlagSystem@9b179bb/engine/pathway-engine.js"></script>

  <!-- Dashboard modules -->
  <script src="dashboard/config.js"></script>
  <script src="dashboard/sheets-reader.js"></script>
  <script src="dashboard/manual-inputs.js"></script>
  <script src="dashboard/breakdown-panel.js"></script>
  <script src="dashboard/state-builder.js"></script>
  <script src="dashboard/scorecard.js"></script>
  <script src="dashboard/checklist.js"></script>
  <script src="dashboard/renewal-radar.js"></script>
  <script src="dashboard/week-cache.js"></script>
  <script src="dashboard/week-nav.js"></script>
  <script src="dashboard/renderer.js"></script>
  <script src="dashboard/tabs.js"></script>
  <script src="dashboard/historical-table.js"></script>
  <script src="app.js"></script>

</body>
</html>
